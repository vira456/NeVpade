<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- nevpade:head -->
  <title>Сторінку не знайдено · NeVpade</title>
</head>
<body>
  <main class="lost">
    <a class="lost__logo" href="/"><svg class="logo-mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" style="fill:var(--accent)"/><circle cx="8.5" cy="19.5" r="3" style="fill:var(--on-accent)"/><circle cx="19.5" cy="8.5" r="2.6" fill="none" style="stroke:var(--on-accent)" stroke-width="2"/><path d="M11 17l5.6-5.6" style="stroke:var(--on-accent)" stroke-width="2" stroke-dasharray="2.4 2.2" stroke-linecap="round"/></svg><span>NeVpade</span></a>

    <!-- Маршрут обривається: точки призначення немає -->
    <div class="lost__route" aria-hidden="true">
      <span class="lost__dot"></span>
      <span class="lost__line"></span>
      <span class="lost__code">404</span>
    </div>

    <h1 class="lost__title">Такої сторінки немає</h1>
    <p class="lost__text">Можливо, посилання застаріло або в адресі помилка. Перевірте адресу чи поверніться до роботи.</p>
    <div class="lost__actions">
      <a class="btn" id="lostHome" href="/">На головну</a>
      <a class="btn btn--ghost" href="/pages/trips.html">Рейси</a>
    </div>
  </main>
  <script type="module" src="/src/js/pages/not-found.js"></script>
</body>
</html>
