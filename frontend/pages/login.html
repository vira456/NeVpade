<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вхід · NeVpade</title>
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:16px">
    <form class="card" id="loginForm" style="width:100%;max-width:360px;display:grid;gap:12px">
      <h1 style="margin:0">NeVpade</h1>
      <input class="input" name="email" type="email" placeholder="Email" required />
      <input class="input" name="password" type="password" placeholder="Пароль" required />
      <button class="btn" type="submit">Увійти</button>
      <p id="loginError" style="color:#d33;margin:0"></p>
    </form>
  </main>
  <script type="module" src="/src/js/pages/login.js"></script>
</body>
</html>
