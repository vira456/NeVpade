<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <!-- nevpade:head -->
  <title>Фінанси · NeVpade</title>
</head>
<body>
  <div class="app">
    <aside class="sidebar"></aside>
    <main class="main owner">
      <header class="main__header">
        <div>
          <h1 class="main__title">Фінанси</h1>
          <p class="main__subtitle" id="ownerSubtitle">&nbsp;</p>
        </div>
        <div class="main__actions">
          <button class="btn btn--ghost" id="financeReport" type="button">Звіт в Excel</button>
          <div class="seg" id="financePeriod" role="group" aria-label="Період">
            <button class="seg__btn" type="button" data-period="month" aria-pressed="true">Місяць</button>
            <button class="seg__btn" type="button" data-period="year" aria-pressed="false">Рік</button>
          </div>
        </div>
      </header>

      <section class="ledger card" id="financeLedger" aria-label="Фінансові підсумки"></section>

      <section class="card owner__chart">
        <div class="card__head">
          <h2 class="card__title">Дохід і витрати</h2>
          <span class="dash__note" id="marginNote"></span>
        </div>
        <ul class="legend" aria-hidden="true">
          <li><span class="legend__swatch legend__swatch--income"></span>Дохід</li>
          <li><span class="legend__swatch legend__swatch--expense"></span>Витрати</li>
        </ul>
        <div class="chart-box"><canvas id="financeChart" role="img" aria-label="Дохід і витрати за періодами"></canvas></div>
        <button class="btn--link dash__table-toggle" id="financeTableToggle" type="button" aria-expanded="false" aria-controls="financeTable">Показати таблицею</button>
        <div class="table-wrap" id="financeTable" hidden></div>
      </section>

      <div class="owner__grid owner__grid--finance">
        <section class="card">
          <div class="card__head">
            <h2 class="card__title">Структура витрат</h2>
            <span class="dash__note" id="expensesTotal"></span>
          </div>
          <ul class="bars" id="financeBars"></ul>
        </section>

        <section class="card">
          <div class="card__head">
            <h2 class="card__title">Клієнти</h2>
          </div>
          <div class="table-wrap">
            <table class="table owner-clients">
              <thead>
                <tr>
                  <th scope="col">Клієнт</th>
                  <th scope="col" class="num">Рейсів</th>
                  <th scope="col" class="num">Дохід</th>
                  <th scope="col" class="num">Не оплачено</th>
                </tr>
              </thead>
              <tbody id="clientsBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/src/js/pages/owner/finance.js"></script>
</body>
</html>
