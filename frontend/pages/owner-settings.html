<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <!-- nevpade:head -->
  <title>Мій акаунт · NeVpade</title>
</head>
<body>
  <div class="app">
    <aside class="sidebar"></aside>
    <main class="main owner acct">
      <header class="main__header">
        <div>
          <h1 class="main__title">Мій акаунт</h1>
          <p class="main__subtitle">Ваші дані й дані компанії</p>
        </div>
      </header>

      <!-- Хто я -->
      <section class="card acct-id">
        <span class="acct-id__avatar" id="acctAvatar" data-no-i18n></span>
        <div class="acct-id__who">
          <h2 class="acct-id__name" id="acctName" data-no-i18n></h2>
          <p class="acct-id__role"><span class="acct-id__chip">Власник компанії</span><span id="acctCompany" data-no-i18n></span></p>
        </div>
        <a class="btn btn--ghost acct-id__pass" href="/pages/forgot-password.html">Змінити пароль</a>
        <dl class="acct-id__facts" id="accountFacts"></dl>
      </section>

      <!-- Компанія -->
      <section class="card acct-co">
        <div class="acct-co__head">
          <h2 class="card__title">Компанія</h2>
          <p class="acct-co__hint">Назву й місто бачать менеджери у своєму кабінеті.</p>
        </div>
        <form class="acct-co__form" id="companyForm" novalidate>
          <div class="auth__alert" hidden></div>
          <div class="field">
            <label class="field__label" for="coName">Назва компанії</label>
            <input class="input" id="coName" name="name" type="text" maxlength="80" autocomplete="organization" />
            <div class="field__error"></div>
          </div>
          <div class="field">
            <label class="field__label" for="coCity">Місто</label>
            <input class="input" id="coCity" name="city" type="text" maxlength="60" autocomplete="address-level2" />
            <div class="field__error"></div>
          </div>
          <button class="btn acct-co__save" type="submit" id="companySave" disabled>Зберегти</button>
        </form>

        <dl class="acct-co__stats">
          <div><dt>Менеджерів</dt><dd id="coManagers">—</dd></div>
          <div><dt>Код компанії</dt><dd id="coCode" data-no-i18n>—</dd></div>
          <div><dt>У системі з</dt><dd id="coSince">—</dd></div>
        </dl>
        <a class="card__link acct-co__more" href="/pages/owner-team.html">Код і менеджери — на сторінці «Менеджери»</a>
      </section>
    </main>
  </div>

  <script type="module" src="/src/js/pages/owner/settings.js"></script>
</body>
</html>
