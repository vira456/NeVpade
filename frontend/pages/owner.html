<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <!-- nevpade:head -->
  <title>Огляд компанії · NeVpade</title>
</head>
<body>
  <div class="app">
    <aside class="sidebar"></aside>
    <main class="main owner">
      <header class="main__header">
        <div>
          <h1 class="main__title">Огляд компанії</h1>
          <p class="main__subtitle" id="ownerSubtitle">&nbsp;</p>
        </div>
        <div class="main__actions">
          <div class="seg" id="ownerPeriod" role="group" aria-label="Період">
            <button class="seg__btn" type="button" data-period="month" aria-pressed="true">Місяць</button>
            <button class="seg__btn" type="button" data-period="year" aria-pressed="false">Рік</button>
          </div>
        </div>
      </header>

      <section class="ledger card" id="ownerLedger" aria-label="Показники компанії"></section>

      <div class="owner__grid">
        <section class="card">
          <div class="card__head">
            <h2 class="card__title">Менеджери за доходом</h2>
            <a class="card__link" href="/pages/owner-team.html">Усі менеджери</a>
          </div>
          <ol class="rank" id="rankList"><li class="rank__empty">Завантажуємо…</li></ol>
        </section>

        <section class="card">
          <div class="card__head">
            <h2 class="card__title">Потребує уваги</h2>
          </div>
          <ul class="attention" id="attentionList"><li class="attention__empty">Завантажуємо…</li></ul>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/src/js/pages/owner/overview.js"></script>
</body>
</html>
