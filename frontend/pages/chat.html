<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
  <meta name="theme-color" content="#1b1c1f" />
  <script>
    // Тема, мова й стан бокової панелі — до показу сторінки, щоб не було «спалаху»
    (function () {
      var root = document.documentElement;
      function get(k, d) { try { var v = localStorage.getItem('nevpade.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
      var theme = get('theme', 'system');
      var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.dataset.theme = dark ? 'dark' : 'light';
      if (get('sidebarCollapsed', false) === true) root.classList.add('sidebar-collapsed');
      if (get('lang', 'uk') === 'en') {
        root.lang = 'en';
        root.classList.add('i18n-pending');
        setTimeout(function () { root.classList.remove('i18n-pending'); }, 1500);
      }
    })();
  </script>
  <style>.i18n-pending body { visibility: hidden; }</style>
  <title>Чат · NeVpade</title>
</head>
<body>
  <div class="app">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="chat-page">
        <section class="card chat" aria-labelledby="chatTitle">
          <header class="chat__head">
            <div>
              <h1 class="chat__title" id="chatTitle">Чат компанії</h1>
              <p class="chat__sub" id="chatSub">&nbsp;</p>
            </div>
            <span class="chat__live" id="chatLive"><span aria-hidden="true"></span>Онлайн</span>
          </header>

          <div class="chat__scroll" id="chatScroll" tabindex="0" aria-label="Повідомлення">
            <ol class="chat__list" id="chatList" aria-live="polite"></ol>
          </div>

          <form class="chat__composer" id="chatForm">
            <label class="visually-hidden" for="chatInput">Повідомлення</label>
            <textarea class="input chat__input" id="chatInput" rows="1" maxlength="2000" placeholder="Напишіть повідомлення…" title="Enter — надіслати, Shift+Enter — новий рядок"></textarea>
            <button class="btn chat__send" type="submit" aria-label="Надіслати"></button>
          </form>
        </section>

        <aside class="card chat-people">
          <h2 class="card__title">У компанії</h2>
          <ul class="chat-people__list" id="chatPeople"></ul>
        </aside>
      </div>
    </main>
  </div>
  <script type="module" src="/src/js/pages/chat.js"></script>
</body>
</html>
