<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- nevpade:head -->
  <title>Чат · NeVpade</title>
</head>
<body>
  <div class="app">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="chat-page">
        <section class="card chat" aria-labelledby="chatTitle">
          <header class="chat__head">
            <div>
              <h1 class="chat__title" id="chatTitle">Чат компанії</h1>
              <p class="chat__sub" id="chatSub">&nbsp;</p>
            </div>
            <span class="chat__live" id="chatLive"><span aria-hidden="true"></span>Онлайн</span>
          </header>

          <div class="chat__scroll" id="chatScroll" tabindex="0" aria-label="Повідомлення">
            <ol class="chat__list" id="chatList" aria-live="polite"></ol>
          </div>

          <form class="chat__composer" id="chatForm">
            <label class="visually-hidden" for="chatInput">Повідомлення</label>
            <textarea class="input chat__input" id="chatInput" rows="1" maxlength="2000" placeholder="Напишіть повідомлення…" title="Enter — надіслати, Shift+Enter — новий рядок"></textarea>
            <button class="btn chat__send" type="submit" aria-label="Надіслати"></button>
          </form>
        </section>

        <aside class="card chat-people">
          <h2 class="card__title">У компанії</h2>
          <ul class="chat-people__list" id="chatPeople"></ul>
        </aside>
      </div>
    </main>
  </div>
  <script type="module" src="/src/js/pages/chat.js"></script>
</body>
</html>
