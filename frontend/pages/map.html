<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
  <meta name="theme-color" content="#1b1c1f" />
  <script>
    // Тема, мова й стан бокової панелі — до показу сторінки, щоб не було «спалаху»
    (function () {
      var root = document.documentElement;
      function get(k, d) { try { var v = localStorage.getItem('nevpade.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
      var theme = get('theme', 'system');
      var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.dataset.theme = dark ? 'dark' : 'light';
      if (get('sidebarCollapsed', false) === true) root.classList.add('sidebar-collapsed');
      if (get('lang', 'uk') === 'en') {
        root.lang = 'en';
        root.classList.add('i18n-pending');
        setTimeout(function () { root.classList.remove('i18n-pending'); }, 1500);
      }
    })();
  </script>
  <style>.i18n-pending body { visibility: hidden; }</style>
  <title>Карта · NeVpade</title>
</head>
<body>
  <div class="app">
    <aside class="sidebar"></aside>
    <main class="main">
      <header class="main__header">
        <h1 class="main__title">Карта маршрутів</h1>
        <span class="map-mode" id="mapMode"></span>
      </header>

      <div class="map-layout">
        <!-- Список рейсів -->
        <section class="card trip-panel" aria-label="Рейси">
          <div class="trip-panel__filters">
            <input class="input" id="mapSearch" type="search" placeholder="Пошук: номер, місто" aria-label="Пошук рейсу" />
            <select class="input" id="mapStatus" aria-label="Статус">
              <option value="">Усі статуси</option>
              <option value="planned">Заплановано</option>
              <option value="in_progress">В дорозі</option>
              <option value="done">Виконано</option>
            </select>
          </div>
          <ul class="trip-list" id="tripList"></ul>
        </section>

        <!-- Карта -->
        <section class="card map-card">
          <div class="map-box" id="map">
            <p class="map-box__loading">Завантаження карти…</p>
          </div>
        </section>

        <!-- Деталі маршруту -->
        <section class="card route-card" id="routeDetails" aria-live="polite"></section>
      </div>
    </main>
  </div>
  <script type="module" src="/src/js/pages/map.js"></script>
</body>
</html>
