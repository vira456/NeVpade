<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
  <meta name="theme-color" content="#1b1c1f" />
  <script>
    // Тема, мова й стан бокової панелі — до показу сторінки, щоб не було «спалаху»
    (function () {
      var root = document.documentElement;
      function get(k, d) { try { var v = localStorage.getItem('nevpade.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
      var theme = get('theme', 'system');
      var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.dataset.theme = dark ? 'dark' : 'light';
      if (get('sidebarCollapsed', false) === true) root.classList.add('sidebar-collapsed');
      if (get('lang', 'uk') === 'en') {
        root.lang = 'en';
        root.classList.add('i18n-pending');
        setTimeout(function () { root.classList.remove('i18n-pending'); }, 1500);
      }
    })();
  </script>
  <style>.i18n-pending body { visibility: hidden; }</style>
  <title>Автопарк · NeVpade</title>
</head>
<body>
  <div class="app">
    <aside class="sidebar"></aside>
    <main class="main">
      <header class="main__header">
        <div>
          <h1 class="main__title">Автопарк</h1>
          <p class="main__subtitle" id="fleetSummary">&nbsp;</p>
        </div>
      </header>

      <div class="toolbar">
        <div class="seg" role="tablist" aria-label="Розділи автопарку">
          <button class="seg__btn" id="tab-vehicles" role="tab" aria-selected="true" aria-controls="panel-vehicles" data-tab="vehicles">Автомобілі<span class="seg__count" id="vehiclesCount"></span></button>
          <button class="seg__btn" id="tab-drivers" role="tab" aria-selected="false" aria-controls="panel-drivers" data-tab="drivers" tabindex="-1">Водії<span class="seg__count" id="driversCount"></span></button>
        </div>
        <p class="toolbar__note" id="fleetAlerts"></p>
      </div>

      <section id="panel-vehicles" role="tabpanel" aria-labelledby="tab-vehicles">
        <div class="vehicles" id="vehicles"></div>
      </section>

      <section id="panel-drivers" role="tabpanel" aria-labelledby="tab-drivers" hidden>
        <div class="card trips-card">
          <div class="table-wrap">
            <table class="table drivers-table">
              <thead>
                <tr>
                  <th>Водій</th>
                  <th>Телефон</th>
                  <th>Авто</th>
                  <th class="num">Ставка</th>
                  <th>Поточний рейс</th>
                  <th>Статус</th>
                  <th><span class="visually-hidden">Дії</span></th>
                </tr>
              </thead>
              <tbody id="driversBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/js/pages/fleet.js"></script>
</body>
</html>
