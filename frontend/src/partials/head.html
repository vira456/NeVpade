<!-- Спільна частина head для всіх сторінок (вставляє плагін nevpadeHead у vite.config.js) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
  <meta name="theme-color" content="#1b1c1f" />
  <!-- Стилі підключені тут, а не з JS — інакше під час переходу сторінка на мить без CSS -->
  <link rel="stylesheet" href="/src/scss/main.scss" />
  <script>
    // Тема, мова й стан бокової панелі — до показу сторінки, щоб не було «спалаху»
    (function () {
      var root = document.documentElement;
      function get(k, d) { try { var v = localStorage.getItem('nevpade.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
      var theme = get('theme', 'system');
      var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.dataset.theme = dark ? 'dark' : 'light';
      // у вузькому вікні панель згорнута, доки людина сама її не розгорне (див. utils/prefs.js)
      var narrow = window.matchMedia && window.matchMedia('(max-width: 1199px)').matches;
      if (narrow ? sessionStorage.getItem('nevpade.sidebarNarrowOpen') !== '1' : get('sidebarCollapsed', false) === true) root.classList.add('sidebar-collapsed');
      if (get('lang', 'uk') === 'en') {
        root.lang = 'en';
        root.classList.add('i18n-pending');
        setTimeout(function () { root.classList.remove('i18n-pending'); }, 1500);
      }
      // Власник має окремий інтерфейс (інші кольори меню) — клас ставимо до малювання, щоб не блимало
      var role = null;
      try {
        var u = localStorage.getItem('token') && JSON.parse(localStorage.getItem('user') || 'null');
        role = u && u.role;
        if (role === 'owner') root.classList.add('owner-ui');
      } catch (e) {}
      // Бокове меню з минулої сторінки — одразу, не чекаючи скриптів (потім layout.js малює його наново)
      try {
        var snap = localStorage.getItem('token') && JSON.parse(localStorage.getItem('nevpade.sidebarSnapshot') || 'null');
        if (snap && snap.lang === get('lang', 'uk') && snap.role === role) {
          var mo = new MutationObserver(function () {
            var s = document.querySelector('.sidebar');
            if (!s) return;
            mo.disconnect();
            if (s.children.length) return;
            s.innerHTML = snap.html;
            var p = location.pathname;
            s.querySelectorAll('a[href]').forEach(function (a) {
              var h = a.getAttribute('href');
              var on = h === p || (p === '/pages/member.html' && (h === '/pages/team.html' || h === '/pages/owner-team.html'));
              a.classList.toggle('is-active', on);
              if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
            });
          });
          mo.observe(root, { childList: true, subtree: true });
          document.addEventListener('DOMContentLoaded', function () { mo.disconnect(); });
        }
      } catch (e) {}
    })();
  </script>
  <style>.i18n-pending body { visibility: hidden; }</style>
